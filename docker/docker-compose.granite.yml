services:
  paxfax:
    depends_on:
      asr:
        condition: service_healthy

  asr:
    build:
      context: ..
      dockerfile: services/asr/Dockerfile.granite
    restart: unless-stopped
    environment:
      - ASR_ENGINE=granite
      - ASR_OPENAI_BASE_URL=http://llama-cpp:8080/v1
      - ASR_GRANITE_MODEL=/models/granite-speech-4.1-2b-Q6_K.gguf
      - ASR_GRANITE_PROMPT=transcribe the speech in English only with proper punctuation and capitalization. Do not translate. If non-English speech is present, transcribe only the English speech. The wake word is Jarvis.
      - ASR_GRANITE_MAX_CONCURRENCY=4
      - ASR_GRANITE_TIMEOUT_S=30
      - ASR_VAD_THRESHOLD=0.50
      - ASR_VAD_MIN_SILENCE_MS=500
      - ASR_VAD_SPEECH_PAD_MS=300
      - ASR_MAX_UTTERANCE_S=10.0
      - ASR_ENDPOINT_IDLE_MS=1200
      - ASR_ENDPOINT_SILENCE_MS=600
      # Smart Turn (semantic end-of-turn). Disabled ⇒ behavior is unchanged.
      - ASR_SMART_TURN_ENABLED=${ASR_SMART_TURN_ENABLED:-true}
      - ASR_SMART_TURN_MODEL=${ASR_SMART_TURN_MODEL:-smart-turn-v3.2-cpu.onnx}
      - ASR_SMART_TURN_REPO=${ASR_SMART_TURN_REPO:-pipecat-ai/smart-turn-v3}
      - ASR_SMART_TURN_SAMPLE_RATE=16000
      - ASR_SMART_TURN_WINDOW_S=8
      - ASR_SMART_TURN_TRIGGER_SILENCE_MS=200
      - ASR_SMART_TURN_COMPLETE_THRESHOLD=0.50
      - ASR_SMART_TURN_COMMIT_GRACE_MS=100
      - ASR_SMART_TURN_HARD_SILENCE_MS=1200
      - ASR_SMART_TURN_MAX_CONCURRENCY=4
      - ASR_MAX_STREAMS_PER_SESSION=64
      - ASR_INFERENCE_TIMEOUT_S=60
      - HF_HOME=/models/hf
    volumes:
      - ../asr-models:/models
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"