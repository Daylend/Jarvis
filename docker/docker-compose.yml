services:
  paxfax:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../personalities:/app/personalities
      - ../sounds:/app/sounds
    environment:
      - DATABASE_URL=file:/app/data/database.sqlite
      - LOG_LEVEL=info
      - LOG_DIR=/app/logs
      - TRANSCRIBE_WS_URL=ws://asr:8765/ws/transcribe
      - TRANSCRIBE_HTTP_URL=http://asr:8765
      - AUTO_JOIN_OWNER=true
      - TRIGGER_PHRASE=jarvis
      - JARVIS_CONTEXT_SECONDS=180
      - VOICE_IDLE_TIMEOUT_SEC=900
      - LLAMA_CPP_URL=http://llama-cpp:8080/v1
      - LLAMA_CPP_MODEL=${LLAMA_CPP_MODEL:-local}
      - LLM_THINKING=${LLM_THINKING:-false}
      - LLM_MAX_HISTORY=${LLM_MAX_HISTORY:-20}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - LLM_CONTEXT_LENGTH=${LLM_CONTEXT_LENGTH:-131072}
      - LLM_MAX_TOOL_LOOP=${LLM_MAX_TOOL_LOOP:-20}
      - TTS_URL=http://tts:8860
      - SOUNDS_DIR=/app/sounds
      - DASHBOARD_ENABLED=true
      - DASHBOARD_WS_PORT=7780
      - DASHBOARD_HTTP_PORT=7781
    ports:
      - "7780:7780"
      - "7781:7781"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    environment:
      - BOT_HOST=paxfax
      - BOT_HTTP_PORT=7781
      - BOT_WS_PORT=7780
    ports:
      - "3000:3000"
    depends_on:
      - paxfax
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tts:
    build:
      context: ..
      dockerfile: services/tts/Dockerfile
    restart: unless-stopped
    environment:
      - TTS_DEVICE=cpu
      - TTS_REF_AUDIO=/app/voice_samples/reference.wav
      - TTS_VOCODER_NAME=vocos
    volumes:
      - ../data:/app/data
      - ../voice_samples:/app/voice_samples
    ports:
      - "8860:8860"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8860/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
