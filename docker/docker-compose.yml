services:
  paxfax:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    environment:
      - DATABASE_URL=file:/app/data/database.sqlite
      - LOG_LEVEL=info
      - LOG_DIR=/app/logs
      - TRANSCRIBE_WS_URL=ws://asr:8765/ws/transcribe
      - TRANSCRIBE_HTTP_URL=http://asr:8765
      - AUTO_JOIN_OWNER=true
      - TRIGGER_PHRASE=jarvis
      - JARVIS_CONTEXT_SECONDS=180
      - VOICE_IDLE_TIMEOUT_SEC=900
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      asr:
        condition: service_healthy

  asr:
    build:
      context: ..
      dockerfile: services/asr/Dockerfile
    restart: unless-stopped
    environment:
      - MOONSHINE_MODEL_DIR=/app/models
      - MOONSHINE_LANGUAGE=en
      - MOONSHINE_UPDATE_INTERVAL=0.25
      - MOONSHINE_VAD_THRESHOLD=0.2
      - MOONSHINE_VAD_WINDOW_DURATION=0.5
      - MOONSHINE_VAD_LOOK_BEHIND_SAMPLES=16384
      - MOONSHINE_VAD_MAX_SEGMENT_DURATION=10.0
      - MOONSHINE_LOG_ORT_RUNS=true
      - MOONSHINE_LOG_OUTPUT_TEXT=true
      # Uncomment for bring-up debugging — saves every stream's PCM under /app/debug-wavs.
      # - MOONSHINE_SAVE_INPUT_WAV_DIR=/app/debug-wavs
    volumes:
      - ../data/asr-models:/app/models
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
