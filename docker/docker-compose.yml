services:
  paxfax:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    environment:
      - DATABASE_URL=file:/app/data/database.sqlite
      - LOG_LEVEL=info
      - LOG_DIR=/app/logs
      - TRANSCRIBE_WS_URL=ws://asr-whisper-rocm:8765/ws/transcribe
      - TRANSCRIBE_HTTP_URL=http://asr-whisper-rocm:8765
      - AUTO_JOIN_OWNER=true
      - TRIGGER_PHRASE=jarvis
      - JARVIS_CONTEXT_SECONDS=180
      - VOICE_IDLE_TIMEOUT_SEC=900
      - LLAMA_CPP_URL=http://llama-cpp:8080/v1
      - LLM_MAX_HISTORY=${LLM_MAX_HISTORY:-20}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - LLM_CONTEXT_LENGTH=${LLM_CONTEXT_LENGTH:-131072}
      - LLM_MAX_TOOL_LOOP=${LLM_MAX_TOOL_LOOP:-20}
      - TTS_URL=http://tts:8860
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tts:
    build:
      context: ..
      dockerfile: services/tts/Dockerfile
    restart: unless-stopped
    environment:
      - TTS_DEVICE=cpu
      - TTS_REF_AUDIO=/app/voice_samples/ultron.mp3
      - TTS_VOCODER_NAME=vocos
    volumes:
      - ../data:/app/data
      - ../voice_samples:/app/voice_samples
    ports:
      - "8860:8860"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8860/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
