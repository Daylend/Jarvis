services:
  paxfax:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    environment:
      - DATABASE_URL=file:/app/data/database.sqlite
      - LOG_LEVEL=info
      - LOG_DIR=/app/logs
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
