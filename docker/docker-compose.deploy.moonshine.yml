services:
  paxfax:
    image: registry.example.com/paxfax:latest
    container_name: paxfax
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/paxfax/data:/app/data
      - /mnt/user/appdata/paxfax/logs:/app/logs
    environment:
      - PUID=99
      - PGID=100
      - DATABASE_URL=file:/app/data/database.sqlite
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/app/logs
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - OWNER_USER_ID=${OWNER_USER_ID}
      - OPENWEBUI_API_URL=${OPENWEBUI_API_URL}
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY}
      - TRANSCRIBE_WS_URL=${TRANSCRIBE_WS_URL:-ws://asr:8765/ws/transcribe}
      - TRANSCRIBE_HTTP_URL=${TRANSCRIBE_HTTP_URL:-http://asr:8765}
      - AUTO_JOIN_OWNER=${AUTO_JOIN_OWNER:-true}
      - TRIGGER_PHRASE=${TRIGGER_PHRASE:-jarvis}
      - JARVIS_CONTEXT_SECONDS=${JARVIS_CONTEXT_SECONDS:-180}
      - VOICE_IDLE_TIMEOUT_SEC=${VOICE_IDLE_TIMEOUT_SEC:-900}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL:-http://llama-cpp:8080/v1}
      - TTS_URL=${TTS_URL:-http://tts:8860}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - deploy
    depends_on:
      asr:
        condition: service_healthy
      tts:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  asr:
    image: registry.example.com/paxfax-asr:latest
    container_name: paxfax-asr
    restart: unless-stopped
    environment:
      - MOONSHINE_MODEL_DIR=/app/models
      - MOONSHINE_LANGUAGE=en
      - MOONSHINE_UPDATE_INTERVAL=${MOONSHINE_UPDATE_INTERVAL:-0.15}
      - MOONSHINE_VAD_THRESHOLD=${MOONSHINE_VAD_THRESHOLD:-0.3}
      - MOONSHINE_VAD_WINDOW_DURATION=${MOONSHINE_VAD_WINDOW_DURATION:-0.3}
      - MOONSHINE_VAD_LOOK_BEHIND_SAMPLES=${MOONSHINE_VAD_LOOK_BEHIND_SAMPLES:-8192}
      - MOONSHINE_VAD_MAX_SEGMENT_DURATION=${MOONSHINE_VAD_MAX_SEGMENT_DURATION:-6.0}
      - MOONSHINE_LOG_ORT_RUNS=${MOONSHINE_LOG_ORT_RUNS:-true}
      - MOONSHINE_LOG_OUTPUT_TEXT=${MOONSHINE_LOG_OUTPUT_TEXT:-true}
      - ASR_ENDPOINT_IDLE_MS=${ASR_ENDPOINT_IDLE_MS:-700}
      - ASR_ENDPOINT_SILENCE_MS=${ASR_ENDPOINT_SILENCE_MS:-500}
      - ASR_ENDPOINT_FORCE_UPDATES=${ASR_ENDPOINT_FORCE_UPDATES:-3}
      - ASR_ENDPOINT_FORCE_UPDATE_INTERVAL_MS=${ASR_ENDPOINT_FORCE_UPDATE_INTERVAL_MS:-150}
    volumes:
      - /mnt/user/appdata/paxfax/asr-models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - deploy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  tts:
    image: registry.example.com/paxfax-tts:latest
    container_name: paxfax-tts
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      - TTS_DEVICE=cuda:0
      - TTS_REF_AUDIO=/app/voice_samples/ultron.mp3
      - TTS_VOCODER_NAME=vocos
      - HF_HOME=/models/hf
      - TORCH_HOME=/models/torch
    volumes:
      - /mnt/user/appdata/paxfax/tts-models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8860/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - deploy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  deploy:
    external: true