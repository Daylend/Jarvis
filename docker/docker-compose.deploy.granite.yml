services:
  paxfax:
    image: registry.example.com/paxfax:latest
    container_name: paxfax
    restart: unless-stopped
    volumes:
      - /srv/docker/appdata/paxfax/data:/app/data
      - /srv/docker/appdata/paxfax/logs:/app/logs
      - /srv/docker/appdata/paxfax/personalities:/app/personalities
      - /srv/docker/appdata/paxfax/sounds:/app/sounds
    environment:
      - PUID=1000
      - PGID=1000
      - DATABASE_URL=file:/app/data/database.sqlite
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/app/logs
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - OWNER_USER_ID=${OWNER_USER_ID}
      - TRANSCRIBE_WS_URL=${TRANSCRIBE_WS_URL:-ws://asr:8765/ws/transcribe}
      - TRANSCRIBE_HTTP_URL=${TRANSCRIBE_HTTP_URL:-http://asr:8765}
      - AUTO_JOIN_OWNER=${AUTO_JOIN_OWNER:-true}
      - TRIGGER_PHRASE=${TRIGGER_PHRASE:-jarvis}
      - JARVIS_CONTEXT_SECONDS=${JARVIS_CONTEXT_SECONDS:-180}
      - VOICE_IDLE_TIMEOUT_SEC=${VOICE_IDLE_TIMEOUT_SEC:-900}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL:-http://llama-cpp:8080/v1}
      - LLAMA_CPP_MODEL=${LLAMA_CPP_MODEL:-local}
      - LLM_THINKING=${LLM_THINKING:-false}
      - LLM_MAX_HISTORY=${LLM_MAX_HISTORY:-20}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - LLM_CONTEXT_LENGTH=${LLM_CONTEXT_LENGTH:-131072}
      - LLM_MAX_TOOL_LOOP=${LLM_MAX_TOOL_LOOP:-20}
      - JARVIS_LLM_BACKEND=${JARVIS_LLM_BACKEND:-local}
      - JARVIS_LLM_TIMEOUT_MS=${JARVIS_LLM_TIMEOUT_MS:-60000}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      - OPENROUTER_REFERER=${OPENROUTER_REFERER:-}
      - OPENROUTER_TITLE=${OPENROUTER_TITLE:-Jarvis}
      - OPENROUTER_PROVIDER_ZDR=${OPENROUTER_PROVIDER_ZDR:-true}
      - OPENROUTER_PROVIDER_ONLY=${OPENROUTER_PROVIDER_ONLY:-}
      - JARVIS_LLM_STATE_PATH=${JARVIS_LLM_STATE_PATH:-/app/data/llm-state.json}
      - TTS_URL=${TTS_URL:-http://tts:8860}
      - SOUNDS_DIR=/app/sounds
      # Mind dashboard (in-process WS + HTTP, owner-only via reverse proxy)
      - DASHBOARD_ENABLED=${DASHBOARD_ENABLED:-true}
      - DASHBOARD_WS_PORT=${DASHBOARD_WS_PORT:-7780}
      - DASHBOARD_HTTP_PORT=${DASHBOARD_HTTP_PORT:-7781}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - npm-net
    depends_on:
      asr:
        condition: service_healthy
      tts:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  dashboard:
    image: registry.example.com/paxfax-dashboard:latest
    container_name: paxfax-dashboard
    restart: unless-stopped
    environment:
      - BOT_HOST=paxfax
      - BOT_HTTP_PORT=7781
      - BOT_WS_PORT=7780
    depends_on:
      - paxfax
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - npm-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  asr:
    image: registry.example.com/paxfax-asr-granite:latest
    container_name: paxfax-asr-granite
    restart: unless-stopped
    environment:
      - ASR_ENGINE=granite
      - ASR_OPENAI_BASE_URL=${ASR_OPENAI_BASE_URL:-http://llama-cpp:8080/v1}
      - ASR_GRANITE_MODEL=${ASR_GRANITE_MODEL:-/models/granite-speech-4.1-2b-Q6_K.gguf}
      - ASR_GRANITE_PROMPT=${ASR_GRANITE_PROMPT:-transcribe the speech in English only with proper punctuation and capitalization. Do not translate. If non-English speech is present, transcribe only the English speech.}
      - ASR_GRANITE_MAX_CONCURRENCY=${ASR_GRANITE_MAX_CONCURRENCY:-4}
      - ASR_GRANITE_TIMEOUT_S=${ASR_GRANITE_TIMEOUT_S:-30}
      - ASR_VAD_THRESHOLD=${ASR_VAD_THRESHOLD:-0.50}
      - ASR_VAD_MIN_SILENCE_MS=${ASR_VAD_MIN_SILENCE_MS:-500}
      - ASR_VAD_SPEECH_PAD_MS=${ASR_VAD_SPEECH_PAD_MS:-300}
      - ASR_MAX_UTTERANCE_S=${ASR_MAX_UTTERANCE_S:-10.0}
      - ASR_ENDPOINT_IDLE_MS=${ASR_ENDPOINT_IDLE_MS:-1200}
      - ASR_ENDPOINT_SILENCE_MS=${ASR_ENDPOINT_SILENCE_MS:-600}
      # Smart Turn (semantic end-of-turn). Disabled ⇒ behavior is unchanged.
      - ASR_SMART_TURN_ENABLED=${ASR_SMART_TURN_ENABLED:-true}
      - ASR_SMART_TURN_MODEL=${ASR_SMART_TURN_MODEL:-smart-turn-v3.2-cpu.onnx}
      - ASR_SMART_TURN_REPO=${ASR_SMART_TURN_REPO:-pipecat-ai/smart-turn-v3}
      - ASR_SMART_TURN_SAMPLE_RATE=${ASR_SMART_TURN_SAMPLE_RATE:-16000}
      - ASR_SMART_TURN_WINDOW_S=${ASR_SMART_TURN_WINDOW_S:-8}
      - ASR_SMART_TURN_TRIGGER_SILENCE_MS=${ASR_SMART_TURN_TRIGGER_SILENCE_MS:-200}
      - ASR_SMART_TURN_COMPLETE_THRESHOLD=${ASR_SMART_TURN_COMPLETE_THRESHOLD:-0.50}
      - ASR_SMART_TURN_COMMIT_GRACE_MS=${ASR_SMART_TURN_COMMIT_GRACE_MS:-100}
      - ASR_SMART_TURN_HARD_SILENCE_MS=${ASR_SMART_TURN_HARD_SILENCE_MS:-1200}
      - ASR_SMART_TURN_MAX_CONCURRENCY=${ASR_SMART_TURN_MAX_CONCURRENCY:-4}
      - ASR_MAX_STREAMS_PER_SESSION=${ASR_MAX_STREAMS_PER_SESSION:-64}
      - ASR_INFERENCE_TIMEOUT_S=${ASR_INFERENCE_TIMEOUT_S:-60}
      - HF_HOME=/models/hf
    volumes:
      - /srv/docker/appdata/paxfax/asr-models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - npm-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  tts:
    # To use Chatterbox Turbo, switch image tag below and set TTS_ENGINE=chatterbox
    # To use dots.tts, switch image tag to paxfax-tts-dots:latest and set TTS_ENGINE=dots
    image: registry.example.com/paxfax-tts:latest
    # image: registry.example.com/paxfax-tts-chatterbox:latest
    # image: registry.example.com/paxfax-tts-dots:latest
    container_name: paxfax-tts
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    shm_size: 8g
    environment:
      - TTS_ENGINE=${TTS_ENGINE:-f5}
      - TTS_DEVICE=cuda:0
      # Chatterbox requires mp3; F5/dots.tts accept wav or mp3. Override
      # TTS_REF_AUDIO (e.g. /app/voice_samples/ultron.mp3) when TTS_ENGINE=chatterbox.
      - TTS_REF_AUDIO=${TTS_REF_AUDIO:-/app/voice_samples/ultron.wav}
      - HF_HOME=/models/hf
      - TORCH_HOME=/models/torch
      # F5-TTS specific config (ignored if TTS_ENGINE != f5)
      - TTS_VOCODER_NAME=vocos
      - TTS_CFG_STEPS=${TTS_CFG_STEPS:-12}
      - TTS_CFG_STRENGTH=${TTS_CFG_STRENGTH:-2.0}
      - TTS_TORCH_COMPILE=${TTS_TORCH_COMPILE:-true}
      # Chatterbox Turbo specific config (ignored if TTS_ENGINE != chatterbox)
      - CHATTERBOX_TEMPERATURE=${CHATTERBOX_TEMPERATURE:-0.8}
      - CHATTERBOX_TOP_P=${CHATTERBOX_TOP_P:-0.95}
      - CHATTERBOX_TOP_K=${CHATTERBOX_TOP_K:-1000}
      - CHATTERBOX_REPETITION_PENALTY=${CHATTERBOX_REPETITION_PENALTY:-1.2}
      - CHATTERBOX_NORM_LOUDNESS=${CHATTERBOX_NORM_LOUDNESS:-true}
      # dots.tts specific config (ignored if TTS_ENGINE != dots)
      - DOTS_MODEL=${DOTS_MODEL:-rednote-hilab/dots.tts-mf}
      - DOTS_NUM_STEPS=${DOTS_NUM_STEPS:-4}
      - DOTS_GUIDANCE_SCALE=${DOTS_GUIDANCE_SCALE:-1.2}
      - DOTS_OPTIMIZE=${DOTS_OPTIMIZE:-false}
      - DOTS_NORMALIZE_TEXT=${DOTS_NORMALIZE_TEXT:-false}
      # MIOpen tuning for the dots.tts BigVGAN decoder convs on gfx1201.
      # Set MIOPEN_TUNE=1 for one warm-up pass (send short/typical/long
      # utterances), then restart with MIOPEN_TUNE=0. The tuned solver DB and
      # JIT kernels persist under the /models volume (tts-models:/models).
      - MIOPEN_TUNE=${MIOPEN_TUNE:-0}
      - MIOPEN_FIND_MODE=${MIOPEN_FIND_MODE:-DYNAMIC_HYBRID}
      - TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1
      - TORCHINDUCTOR_CACHE_DIR=/models/torchinductor/f5-aotriton
    volumes:
      - /srv/docker/appdata/paxfax/voice_samples:/app/voice_samples
      - /srv/docker/appdata/paxfax/tts-models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8860/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      # dots.tts pulls ~5GB on first boot (vs F5/Chatterbox's smaller cache);
      # 600s may be tight for dots — bump to 900s if TTS_ENGINE=dots.
      start_period: 600s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - npm-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  npm-net:
    external: true