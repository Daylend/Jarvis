services:
  paxfax:
    image: registry.example.com/paxfax:latest
    container_name: paxfax
    restart: unless-stopped
    volumes:
      - /mnt/user/appdata/paxfax/data:/app/data
      - /mnt/user/appdata/paxfax/logs:/app/logs
    environment:
      - PUID=99
      - PGID=100
      - DATABASE_URL=file:/app/data/database.sqlite
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/app/logs
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - OWNER_USER_ID=${OWNER_USER_ID}
      - OPENWEBUI_API_URL=${OPENWEBUI_API_URL}
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY}
      - TRANSCRIBE_WS_URL=${TRANSCRIBE_WS_URL:-ws://asr-whisper-rocm:8765/ws/transcribe}
      - TRANSCRIBE_HTTP_URL=${TRANSCRIBE_HTTP_URL:-http://asr-whisper-rocm:8765}
      - AUTO_JOIN_OWNER=${AUTO_JOIN_OWNER:-true}
      - TRIGGER_PHRASE=${TRIGGER_PHRASE:-jarvis}
      - JARVIS_CONTEXT_SECONDS=${JARVIS_CONTEXT_SECONDS:-180}
      - VOICE_IDLE_TIMEOUT_SEC=${VOICE_IDLE_TIMEOUT_SEC:-900}
      - LLAMA_CPP_URL=${LLAMA_CPP_URL:-http://llama-cpp:8080/v1}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - deploy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  deploy:
    external: true
