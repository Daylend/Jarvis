services:
  paxfax:
    image: registry.example.com/paxfax:latest
    container_name: paxfax
    restart: unless-stopped
    env_file:
      - stack.env
    volumes:
      - /mnt/user/appdata/paxfax/data:/app/data
      - /mnt/user/appdata/paxfax/logs:/app/logs
    environment:
      - PUID=99
      - PGID=100
      - DATABASE_URL=file:/app/data/database.sqlite
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/app/logs
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - OWNER_USER_ID=${OWNER_USER_ID}
      - OPENWEBUI_API_URL=${OPENWEBUI_API_URL}
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY}
      - TRANSCRIBE_WS_URL=${TRANSCRIBE_WS_URL:-ws://asr:8765/ws/transcribe}
      - TRANSCRIBE_HTTP_URL=${TRANSCRIBE_HTTP_URL:-http://asr:8765}
      - AUTO_JOIN_OWNER=${AUTO_JOIN_OWNER:-true}
      - TRIGGER_PHRASE=${TRIGGER_PHRASE:-jarvis}
      - JARVIS_CONTEXT_SECONDS=${JARVIS_CONTEXT_SECONDS:-180}
      - VOICE_IDLE_TIMEOUT_SEC=${VOICE_IDLE_TIMEOUT_SEC:-900}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - deploy
    depends_on:
      asr:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  asr:
    image: registry.example.com/paxfax-asr:latest
    container_name: paxfax-asr
    restart: unless-stopped
    environment:
      - MODEL_PATH=/app/models/ggml-large-v3-turbo-q5_0.bin
      - DEVICE=${ASR_DEVICE:-vulkan}
      - VAD_THRESHOLD=${VAD_THRESHOLD:-0.5}
      - END_SILENCE_MS=${END_SILENCE_MS:-700}
      - MAX_UTTERANCE_MS=${MAX_UTTERANCE_MS:-25000}
      # Force ggml-vulkan to select GPU 0 (required for AMD/ROCm Vulkan)
      - GGML_VK_VISIBLE_DEVICES=${GGML_VK_VISIBLE_DEVICES:-0}
    volumes:
      - /mnt/user/appdata/paxfax/asr-models:/app/models
    # AMD GPU / Vulkan + ROCm access (mirrors working llama-cpp-rocm config)
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - deploy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  deploy:
    external: true
