services:
  paxfax:
    depends_on:
      asr-whisper-rocm:
        condition: service_healthy

  asr-whisper-rocm:
    build:
      context: ..
      dockerfile: services/asr-whisper-rocm/Dockerfile
      args:
        BASE_IMAGE: rocm/pytorch:latest
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      - ASR_MODEL_ID=openai/whisper-large-v3-turbo
      - ASR_DEVICE=cuda:0
      - ASR_DTYPE=float16
      - ASR_ENABLE_PARTIALS=false
      - ASR_LANGUAGE=en
      - ASR_TASK=transcribe
      - ASR_VAD_THRESHOLD=0.50
      - ASR_VAD_MIN_SILENCE_MS=800
      - ASR_VAD_SPEECH_PAD_MS=300
      - ASR_MAX_UTTERANCE_S=24.0
      - HF_HOME=/models/hf
      - TRANSFORMERS_CACHE=/models/hf
    volumes:
      - asr_models_cache:/models
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  asr_models_cache:
