# Build the containers using rootless BuildKit, then push to local container registry.
# Requires env vars REGISTRY_USERNAME and REGISTRY_PASSWORD.

stages:
  - build

variables:
  DOCKER_REGISTRY: registry.example.com

  # Bot image
  DOCKER_IMAGE_NAME: paxfax
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHA
  DOCKER_IMAGE: $DOCKER_REGISTRY/$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
  LATEST_IMAGE: $DOCKER_REGISTRY/$DOCKER_IMAGE_NAME:latest

  # ASR sidecar image (Whisper)
  ASR_WHISPER_IMAGE_NAME: paxfax-asr-whisper
  ASR_WHISPER_IMAGE: $DOCKER_REGISTRY/$ASR_WHISPER_IMAGE_NAME:$CI_COMMIT_SHA
  ASR_WHISPER_LATEST_IMAGE: $DOCKER_REGISTRY/$ASR_WHISPER_IMAGE_NAME:latest

  # ASR sidecar image (Granite)
  ASR_GRANITE_IMAGE_NAME: paxfax-asr-granite
  ASR_GRANITE_IMAGE: $DOCKER_REGISTRY/$ASR_GRANITE_IMAGE_NAME:$CI_COMMIT_SHA
  ASR_GRANITE_LATEST_IMAGE: $DOCKER_REGISTRY/$ASR_GRANITE_IMAGE_NAME:latest

  # TTS sidecar image
  TTS_IMAGE_NAME: paxfax-tts
  TTS_IMAGE: $DOCKER_REGISTRY/$TTS_IMAGE_NAME:$CI_COMMIT_SHA
  TTS_LATEST_IMAGE: $DOCKER_REGISTRY/$TTS_IMAGE_NAME:latest

  # TTS chatterbox sidecar image
  TTS_CHATTERBOX_IMAGE_NAME: paxfax-tts-chatterbox
  TTS_CHATTERBOX_IMAGE: $DOCKER_REGISTRY/$TTS_CHATTERBOX_IMAGE_NAME:$CI_COMMIT_SHA
  TTS_CHATTERBOX_LATEST_IMAGE: $DOCKER_REGISTRY/$TTS_CHATTERBOX_IMAGE_NAME:latest

  # TTS dots.tts sidecar image
  TTS_DOTS_IMAGE_NAME: paxfax-tts-dots
  TTS_DOTS_IMAGE: $DOCKER_REGISTRY/$TTS_DOTS_IMAGE_NAME:$CI_COMMIT_SHA
  TTS_DOTS_LATEST_IMAGE: $DOCKER_REGISTRY/$TTS_DOTS_IMAGE_NAME:latest

  # Rootless BuildKit configuration
  BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  BUILDKIT_CACHE_DIR: /cache/buildkit

.buildkit-auth: &buildkit-auth
  - mkdir -p ~/.docker "$BUILDKIT_CACHE_DIR" /cache/buildkit-root /cache/buildkit-tmp
  - |
    if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
      echo "Configuring registry auth for $DOCKER_REGISTRY"
      cat > ~/.docker/config.json <<EOF
    {
      "auths": {
        "$DOCKER_REGISTRY": {
          "username": "$REGISTRY_USERNAME",
          "password": "$REGISTRY_PASSWORD"
        }
      }
    }
    EOF
    fi

# ── Bot ───────────────────────────────────────────────────────────────────────
build-docker:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  before_script: *buildkit-auth
  script:
    - echo "Building and pushing bot Docker image..."
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=docker \
        --opt filename=Dockerfile \
        --opt build-arg:BUILD_SHA="$CI_COMMIT_SHA" \
        --import-cache type=local,src="$BUILDKIT_CACHE_DIR/paxfax" \
        --export-cache type=local,dest="$BUILDKIT_CACHE_DIR/paxfax",mode=max \
        --output type=image,\"name=$DOCKER_IMAGE,$LATEST_IMAGE\",push=true
    - echo "Successfully pushed $DOCKER_IMAGE"
    - echo "Also tagged and pushed as $LATEST_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  tags:
    - docker

# ── ASR Sidecar (Whisper) ────────────────────────────────────────────────────────
build-asr-whisper:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  before_script: *buildkit-auth
  script:
    - echo "Building and pushing Whisper ASR Docker image..."
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=services/asr \
        --opt filename=Dockerfile \
        --import-cache type=local,src="$BUILDKIT_CACHE_DIR/paxfax-asr-whisper" \
        --export-cache type=local,dest="$BUILDKIT_CACHE_DIR/paxfax-asr-whisper",mode=max \
        --output type=image,\"name=$ASR_WHISPER_IMAGE,$ASR_WHISPER_LATEST_IMAGE\",push=true
    - echo "Successfully pushed $ASR_WHISPER_IMAGE"
    - echo "Also tagged and pushed as $ASR_WHISPER_LATEST_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/asr/**/*
        - .gitlab-ci.yml
      when: on_success
  tags:
    - docker

