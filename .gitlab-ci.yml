stages:
  - build

variables:
  DOCKER_REGISTRY: registry.example.com

  # Bot image
  DOCKER_IMAGE_NAME: paxfax
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHA
  DOCKER_IMAGE: $DOCKER_REGISTRY/$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
  LATEST_IMAGE: $DOCKER_REGISTRY/$DOCKER_IMAGE_NAME:latest

  # ASR sidecar image
  ASR_IMAGE_NAME: paxfax-asr
  ASR_IMAGE: $DOCKER_REGISTRY/$ASR_IMAGE_NAME:$CI_COMMIT_SHA
  ASR_LATEST_IMAGE: $DOCKER_REGISTRY/$ASR_IMAGE_NAME:latest

  # Explicit build cache image in your own registry
  ASR_CACHE_IMAGE: registry.example.com/paxfax-asr-buildcache:main

  # Docker-in-Docker, TLS disabled
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_TLS_VERIFY: ""
  DOCKER_CERT_PATH: ""
  DOCKER_DRIVER: overlay2

# ── Bot ───────────────────────────────────────────────────────────────────────
build-docker:
  stage: build
  image: docker:27.4.1-cli
  services:
    - name: docker:27.4.1-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - echo "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USERNAME" --password-stdin "$DOCKER_REGISTRY"
  script:
    - echo "Building bot Docker image..."
    - docker build -t "$DOCKER_IMAGE" -t "$LATEST_IMAGE" -f docker/Dockerfile .
    - echo "Pushing bot image to registry $DOCKER_REGISTRY"
    - docker push "$DOCKER_IMAGE"
    - docker push "$LATEST_IMAGE"
    - echo "Successfully built and pushed $DOCKER_IMAGE"
    - echo "Also tagged and pushed as $LATEST_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  tags:
    - docker

# ── ASR Sidecar ───────────────────────────────────────────────────────────────
build-asr:
  stage: build
  image: docker:27.4.1-cli
  services:
    - name: docker:27.4.1-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - echo "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USERNAME" --password-stdin "$DOCKER_REGISTRY"
    - echo "ASR_IMAGE=$ASR_IMAGE"
    - echo "ASR_LATEST_IMAGE=$ASR_LATEST_IMAGE"
    - echo "ASR_CACHE_IMAGE=$ASR_CACHE_IMAGE"
    - docker context create asr-builder || true
    - docker buildx create asr-builder --driver docker-container --use || docker buildx use asr-builder
    - docker buildx inspect --bootstrap
  script:
    - |
      docker buildx build \
        --file services/asr/Dockerfile \
        --tag "$ASR_IMAGE" \
        --tag "$ASR_LATEST_IMAGE" \
        --cache-from "type=registry,ref=$ASR_CACHE_IMAGE" \
        --cache-to "type=registry,ref=$ASR_CACHE_IMAGE,mode=max" \
        --push \
        .
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - services/asr/**/*
        - .gitlab-ci.yml
      when: on_success
  tags:
    - docker